function bcCalc(){var o=bc,pw=o.pwa?1:0,costs=[],ramp=[o.quick?0.1:0,.25,.75,1,1,1,1,1],i,full=Math.round(o.spend*.75*o.media/10)/10+o.spend*.25*o.agency/100+8.4*o.redeploy/100+2,cum=0,npv=0,rows=[],pay=null,sr=0;
 for(i=0;i<8;i++){costs.push(i===0?21:i===1?23.1-1.1*pw:19.5-1.8*pw);var b=full*ramp[i],n=b-costs[i];cum+=n;if(i<5){npv+=n/Math.pow(1.12,i+1);sr+=ramp[i]}if(pay===null&&cum>=0)pay=2027+i;rows.push({y:2027+i,c:costs[i],b:b,n:n,cum:cum})}
 var net5=rows[4].cum,slope=o.spend*.0075*sr;return{rows:rows,full:full,net5:net5,npv:npv,pay:pay,be:slope?o.media-net5/slope:null,cash:full-8.4*o.redeploy/100}}
