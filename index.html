return `<div class="card taskview"><div class="visual-heading"><div><div class="section-title">${esc(t.store)}: ${esc(t.task)}</div><div class="visual-note">${esc(t.campaign)} · due ${dt(t.due)} · ${esc(t.owner)}</div></div><button class="btn small" data-close>Close</button></div>${S(1,'Receive the instruction',1,`<p>${t.campaign==='Fresh for Less'?'Build the fresh produce endcap before opening. Use the v2 labels from the pack. Photograph the finished endcap from the aisle.':'Follow the store pack for this campaign and photograph the finished display.'}</p>`)}${S(2,'Acknowledge the task',ack,ack?'':'<p><button class="btn small primary" data-ack>Acknowledge</button></p>')}${S(3,'Complete the activity',k,ack?CKL.map((x,i)=>`<label class="chk"><input type="checkbox" data-ck="${i}" ${t.ck>i?'checked':''} ${dn?'disabled':''}> ${x}</label>`).join(''):'')}${S(4,'Upload evidence',e,k||e?`<p>${t.ev.map(x=>`<span class="photo">${esc(x)}</span>`).join('')||'No photos yet'}</p>${dn?'':'<button class="btn small" data-photo>Add photo</button>'}`:'')}${S(5,'Flag an issue',!!t.issue,t.issue?`<p>${esc(t.issue.type)}: ${esc(t.issue.note)}</p>`:ack&&!dn?`<p><select id="itype">${ISS.map(x=>`<option>${x}</option>`).join('')}</select> <input id="inote" placeholder="What is wrong" style="min-width:200px"> <button class="btn small" data-issue>Flag</button></p>`:'')}${S(6,'Confirm completion',dn,e&&!dn?'<p><button class="btn small primary" data-done>Confirm done</button></p>':'')}</div>`}
function view(){nav();let c=document.querySelector('#content'),act=(s)=>`<button class="btn primary" data-new="${s}">＋ ${s}</button>`;switch(page){case'Overview':c.innerHTML=hdr('Overview','Pilot week 7 of 16. Fresh for Less is in market across the 11 pilot stores.',`<button class="btn" data-page="Measurement">View performance</button> ${act('Campaign')}`)+stats([['Active campaigns',db.campaigns.filter(x=>x.status==='Live').length,'Across planning and execution'],['Approvals waiting',db.approvals.filter(x=>x.status==='Pending').length,'Review queue'],['Store tasks open',db.tasks.filter(x=>x.status!=='Done').length,'Across the 11 pilot stores'],['Media placements',db.placements.length,'Booked or requiring confirmation']])+`<div class="grid cols"><div class="card visual-card"><div class="visual-heading"><div><div class="section-title">Campaign portfolio</div><div class="visual-note">Progress by campaign</div></div><button class="btn small" data-page="Campaigns">View all</button></div>${db.campaigns.map(x=>`<div class="barrow"><span>${esc(x.name)}</span><div class="bar"><i style="width:${x.status==='Closed'?100:x.status==='Live'?78:x.status==='Approved'?48:28}%"></i></div>${badge(x.status)}</div>`).join('')}<div class="section-title" style="margin-top:22px">A campaign, from brief to learning</div><div class="workflow" role="img" aria-label="Campaign workflow: Brief, Plan, Approve, Activate, Measure"><div class="flowstep">${icon('Asset Library')}<b>Brief</b><small>One clear ask</small></div><div class="flowstep">${icon('Campaigns')}<b>Plan</b><small>People &amp; timing</small></div><div class="flowstep">${icon('Approvals')}<b>Approve</b><small>Ready to go</small></div><div class="flowstep">${icon('Field Activations')}<b>Activate</b><small>In market</small></div><div class="flowstep">${icon('Measurement')}<b>Learn</b><small>What worked</small></div></div></div><div class="card"><div class="section-title">Needs attention</div><div class="feed">${db.approvals.filter(x=>x.status==='Pending').slice(0,3).map(x=>`<div class="feeditem"><i class="dot"></i><div><b>${esc(x.item)}</b><small>${esc(x.owner)} · due ${dt(x.due)}${x.due<'2027-08-24'?' · overdue':''}</small></div></div>`).join('')||'<p class="muted">Nothing waiting right now.</p>'}</div><p><button class="btn small" data-page="Approvals">Review queue</button></p></div></div><div class="callout">Every campaign starts with one brief, a named owner, a target audience, a measurable objective and an approved budget.</div>`;break;
case'Campaigns':c.innerHTML=hdr('Campaigns','Brief, plan, approve and track a campaign from one record.',act('Campaign'))+`<div class="tools"><input class="search" placeholder="Search campaigns" data-search>${['All','In review','Approved','Live'].map(s=>`<button class="btn small" data-filter="${s}">${s}</button>`).join('')}</div><div class="card">${table(['Campaign','Owner','Category','Stores','Dates','Status'],rows(db.campaigns.filter(x=>!query||JSON.stringify(x).toLowerCase().includes(query)).map(x=>({...x,dates:`${dd(x.start)} to ${dd(x.end)}`})),['name','owner','category','stores','dates','status']))}</div>`;break;
case'Approvals':c.innerHTML=hdr('Approval queue','A traceable review path for briefs, creative and store packs.')+`<div class="card">${table(['Item','Type','Owner','Due','Status','Action'],db.approvals.map((x,i)=>`<tr><td class="name">${esc(x.item)}</td><td>${esc(x.type)}</td><td>${esc(x.owner)}</td><td>${dt(x.due)}</td><td>${badge(x.status)}</td><td>${x.status==='Pending'?`<button class="btn small" data-approve="${i}">Approve</button> <button class="btn small" data-return="${i}">Send back</button>`:'—'}</td></tr>`).join(''))}</div><div class="callout">Approval is due within 2 working days of the final asset being submitted.</div>`;break;
case'Asset Library':c.innerHTML=hdr('Asset library','Keep approved assets, versions, campaign links and usage status together.',act('Asset'))+`<div class="card">${table(['Asset','Campaign','Type','Version','Owner','Status'],rows(db.assets,['name','campaign','type','version','owner','status']))}</div><div class="callout">Only approved versions are released to stores and agencies.</div>`;break;
case'Store Execution':c.innerHTML=hdr('Store execution','Turn campaign packs into assigned, deadline-based store tasks.',act('Store task'))+detail()+`<div class="card">${table(['Store','Task','Campaign','Owner','Due','Status','Task'],db.tasks.map((x,i)=>`<tr><td>${esc(x.store)}</td><td class="name">${esc(x.task)}${x.issue?'<br><small class="muted">Issue: '+esc(x.issue.note)+'</small>':''}</td><td>${esc(x.campaign)}</td><td>${esc(x.owner)}</td><td>${dt(x.due)}</td><td>${badge(x.status)}</td><td><button class="btn small" data-open="${i}">Open</button></td></tr>`).join(''))}</div><div class="callout">Store packs go out at least 3 working days before execution where practical.</div>`;break;
case'Field Activations':c.innerHTML=hdr('Field activations','Coordinate people, stock, location, consent and proof of execution.',act('Activation'))+`<div class="card">${table(['Activation','Location','Date','Lead','Checklist','Status'],rows(db.activations,['name','location','date','lead','checklist','status']))}</div>`;break;
case'Retail Media':c.innerHTML=hdr('Retail media','Plan placements and reconcile delivery against campaign and booking.',act('Placement'))+`<div class="card">${table(['Placement','Channel','Campaign','Start','End','Status'],rows(db.placements,['name','channel','campaign','start','end','status']))}</div><div class="callout">Each placement is reconciled against its booking when it ends.</div>`;break;
case'Measurement':{let m=mx();c.innerHTML=hdr('Measurement','Pilot scorecard, week 7. Targets are the proposed pilot targets.')+stats([['Approval turnaround','1.2 days','Median working days; 86% within the 2-day target'],['Weekly active users','27 of 36','75% of pilot users; exit target is 70%'],['Proof of execution',m.pr+'%','Evidence within 48 hours; steady-state target 85%'],['On-time rate',m.ot+'%','Store tasks done by the due date'],['Data feed health','1 of 2','Ad platform export is one day late'],['Value tracker','46 hrs','Capacity released, not cash. Cash savings confirmed: KES 0']]).replace('grid stats','grid stats six')+`<div class="card visual-card" style="margin-bottom:15px"><div class="visual-heading"><div><div class="section-title">Reading the campaign result</div><div class="visual-note">Value Week, 19 to 25 Jul 2027, against the four weeks before</div></div><span class="badge gray">Closed</span></div><svg class="chart" viewBox="0 0 760 190" role="img" aria-label="Value Week sell-through index 104 against a baseline of 100"><title>Value Week sell-through index 104 against a baseline of 100</title><line class="gridline" x1="180" y1="38" x2="690" y2="38"/><line class="gridline" x1="180" y1="86" x2="690" y2="86"/><line class="gridline" x1="180" y1="134" x2="690" y2="134"/><text x="145" y="42">110</text><text x="145" y="90">100</text><text x="151" y="138">90</text><text x="10" y="69">Baseline</text><rect x="180" y="51" width="510" height="25" rx="8" fill="#f4b095"/><text x="700" y="69" style="fill:#766b74;font-weight:700">100</text><text x="10" y="117">Value Week</text><rect x="180" y="99" width="535" height="25" rx="8" fill="#c92d4b"/><text x="723" y="117" style="fill:#c92d4b;font-weight:700">104</text><text x="180" y="169">Sell-through index, 100 = the four weeks before launch (scale 90 to 110)</text></svg><div class="chart-legend"><span><i class="legend-dot"></i>Value Week</span><span><i class="legend-dot soft"></i>Baseline, index 100</span></div></div><div class="grid cols"><div class="card"><div class="section-title">Campaign scorecard</div>${table(['Campaign','Window','Execution','Sell-through index'],`<tr><td>Value Week</td><td>19 to 25 Jul</td><td>91%</td><td>104</td></tr><tr><td>Fresh for Less</td><td>23 Aug to 5 Sep</td><td>${m.pr}% so far</td><td>—</td></tr><tr><td>Back to School Basics</td><td>30 Aug to 12 Sep</td><td>—</td><td>—</td></tr>`)}</div><div class="card"><div class="section-title">Measurement discipline</div><p>Define baseline, comparison period, promoted SKU list, stores in scope and data owner before launch.</p><p>Separate sales outcomes from reach, media delivery and operational completion.</p><button class="btn" data-export>Export scorecard (CSV)</button></div></div>`;break}
case'Controls & Integrations':c.innerHTML=hdr('Controls & integrations','Access, data feeds and records that keep the workspace auditable.')+`<div class="card">${table(['Area','Setting','Status','Owner'],[['Identity & access','Single sign-on, multi-factor sign-in, role-based access','Active','IT and Security'],['Guest accounts','Agencies and suppliers, scoped to assigned work, expiring when the engagement ends','Active','Requesting department lead'],['Audit log','Creation, approval, change, access and export events','Active','Data Owner'],['Spend data','Weekly finance file import','Healthy','Finance'],['Ad platform data','Weekly export from agencies','Delayed','Digital & Performance'],['POS promotion results','Connection planned after the pilot','Not connected','Data Owner'],['Backups','Daily copy of campaign, task and approval records','Active','IT and Security']].map(r=>`<tr>${r.map((v,i)=>`<td class="${i===0?'name':''}">${i===2?badge(v):esc(v)}</td>`).join('')}</tr>`).join(''))}</div>`;break} }
function modal(kind){let defs={'Campaign':['Create campaign','name,owner,category,stores,start,end,objective'],Asset:['Add asset record','name,campaign,type,version,owner'], 'Store task':['Create store task','store,task,campaign,owner,due'],Activation:['Plan activation','name,location,date,lead,checklist'],Placement:['Book media placement','name,channel,campaign,start,end']},d=defs[kind];if(!d)return;let [title,fields]=d,keys=fields.split(',');document.querySelector('#modalroot').innerHTML=`<div class="modalbg" data-modal-close><div class="modal" onclick="event.stopPropagation()"><div class="modalhead"><h2>${title}</h2><button class="close" data-modal-close>×</button></div><form data-form="${kind}"><div class="formgrid">${keys.map(k=>`<div class="field"><label>${k[0].toUpperCase()+k.slice(1)}</label>${['objective','checklist'].includes(k)?`<textarea name="${k}" required></textarea>`:`<input name="${k}" ${['start','end','date','due'].includes(k)?'type="date"':'type="text"'} required>`}</div>`).join('')}</div><div class="right" style="justify-content:flex-end"><button type="button" class="btn" data-modal-close>Cancel</button><button class="btn primary">Save ${kind.toLowerCase()}</button></div></form></div></div>`}
document.addEventListener('click',e=>{let b=e.target.closest('button');if(!b)return;if(b.dataset.open!==undefined){openTask=+b.dataset.open;view();window.scrollTo(0,0);return}if(b.hasAttribute('data-close')){openTask=null;view();return}if(openTask!==null){let t=db.tasks[openTask];if(b.hasAttribute('data-ack')){norm(t);t.status='Acknowledged';save();view();return}if(b.hasAttribute('data-photo')){norm(t);t.ev.push('Photo '+(t.ev.length+1));t.status='Evidence in';t.proof=3;save();view();return}if(b.hasAttribute('data-issue')){norm(t);t.issue={type:document.getElementById('itype').value,note:document.getElementById('inote').value||'No note'};save();view();return}if(b.hasAttribute('data-done')){norm(t);t.status='Done';save();view();return}}if(b.dataset.page){page=b.dataset.page;query='';view()}if(b.dataset.new)modal(b.dataset.new);if(b.hasAttribute('data-modal-close'))document.querySelector('#modalroot').innerHTML='';if(b.dataset.approve!==undefined){db.approvals[b.dataset.approve].status='Approved';save();view()}if(b.dataset.return!==undefined){db.approvals[b.dataset.return].status='Changes requested';save();view()}if(b.dataset.task!==undefined){db.tasks[b.dataset.task].status='Done';db.tasks[b.dataset.task].proof=2;save();view()}if(b.dataset.filter){document.querySelectorAll('[data-filter]').forEach(x=>x.classList.remove('dark'));b.classList.add('dark');let q=b.dataset.filter==='All'?'':b.dataset.filter.toLowerCase();let rows=document.querySelectorAll('#content tbody tr');document.querySelectorAll('#content tbody tr').forEach(r=>r.style.display=!q||r.innerText.toLowerCase().includes(q)?'':'none')}if(b.hasAttribute('data-export')){let csv='Campaign,Window,Execution,Sell-through index\nValue Week,19 to 25 Jul 2027,91%,104\nFresh for Less,23 Aug to 5 Sep 2027,,\nBack to School Basics,30 Aug to 12 Sep 2027,,\n',a=document.createElement('a');a.href=URL.createObjectURL(new Blob([csv],{type:'text/csv'}));a.download='campaign-scorecard.csv';a.click()}});
document.addEventListener('input',e=>{if(e.target.matches('[data-search]')){query=e.target.value.toLowerCase();view();let inp=document.querySelector('[data-search]');inp.focus();inp.value=e.target.value}});document.addEventListener('submit',e=>{if(!e.target.matches('[data-form]'))return;e.preventDefault();let kind=e.target.dataset.form,obj=Object.fromEntries(new FormData(e.target));if(kind==='Campaign'){obj.id='CMP-'+String(Date.now()).slice(-3);obj.status='In review';db.campaigns.unshift(obj);db.approvals.unshift({id:'APR-'+String(Date.now()).slice(-3),item:obj.name+' campaign brief',type:'Campaign',owner:obj.owner,due:'2027-08-26',status:'Pending'})}else if(kind==='Asset'){obj.status='In review';db.assets.unshift(obj)}else if(kind==='Store task'){obj.status='Not started';db.tasks.unshift(obj)}else if(kind==='Activation'){obj.status='Planned';db.activations.unshift(obj)}else if(kind==='Placement'){obj.status='Needs confirmation';db.placements.unshift(obj)}save();document.querySelector('#modalroot').innerHTML='';view()});document.addEventListener('change',e=>{if(e.target.dataset&&e.target.dataset.ck!==undefined&&openTask!==null){let t=norm(db.tasks[openTask]),i=+e.target.dataset.ck;t.ck=e.target.checked?Math.max(t.ck,i+1):i;if(t.status==='Acknowledged')t.status='In progress';save();view()}});view();
